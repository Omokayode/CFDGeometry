[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-geometry"
version = "0.1.0"
description = "GIS and DEM to STL tools for urban wind CFD (OpenFOAM) geometry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CFDGeometry contributors" }]
keywords = ["cfd", "openfoam", "stl", "gis", "urban-wind"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "geopandas>=0.14",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "scipy>=1.11",
    "shapely>=2.0",
    "trimesh>=4.0",
    "mapbox-earcut>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
download = ["osmnx>=1.9", "requests>=2.28"]
gdal = ["gdal>=3.6"]
gui = []

[project.scripts]
cfd-geometry = "cfd_geometry.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
